<h1>{{ 'pages.services.title' | translate }}</h1>

<ul class="cards">
  @for (service of services; track service.id) {
    <li>
      <app-card class="card-cmp"
        [title]="service.title | translate"
        [description]="service.description | translate"
        [imageSrc]="service.image"
      />
    </li>
  }
</ul>
