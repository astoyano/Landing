<a class="skip-link" href="#main" (click)="skipToMain($event)">
  {{ 'app.skipLink' | translate }}
</a>

<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">{{ 'profile.initials' | translate }}</span>
      <span class="brand__name">{{ 'profile.name' | translate }}</span>
    </a>

    <nav [attr.aria-label]="'app.nav.label' | translate">
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.exact }"
            >
              {{ item.label | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <app-language-switcher />
  </div>
</header>

<main #main id="main" class="content" tabindex="-1">
  <router-outlet />
</main>

<app-footer />
